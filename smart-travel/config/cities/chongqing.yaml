# config/cities/chongqing.yaml
#
# 重庆配置。结构说明见 wuhan.yaml。
# ============================================================

name: 重庆
region: 重庆

transport_hubs: [重庆北站, 重庆西站, 沙坪坝站, 江北机场]

stay_districts: [渝中区, 江北区, 南岸区, 沙坪坝区, 九龙坡区, 大渡口区, 北碚区]

crawl:
  page_size_core: 5
  page_size_category: 20
  max_pages_core: 1
  max_pages_category: 2

core_spots:
  历史人文: [洪崖洞, 解放碑, 磁器口, 湖广会馆, 白公馆, 渣滓洞, 三峡博物馆, 人民大礼堂]
  自然风光: [南山, 缙云山, 歌乐山, 鹅岭公园, 枇杷山公园]
  美食探店: [八一好吃街, 较场口夜市]
  购物休闲: [观音桥, 来福士]
  夜生活: [长江索道, 两江夜游, 南山一棵树观景台]

category_words: [风景区, 古镇, 博物馆, 公园, 步行街]

clean_rules:
  hard_exclude_names: [停车场, 售票处, 游客中心, 服务中心, 安检, 地铁站, 公交站, 出入口, 派出所, 公共厕所, 卫生间]
  hard_exclude_types: [地铁站, 公交车站, 停车场, 售票处, 公共厕所, 住宿服务]
  soft_exclude_types: [学校, 科教文化服务, 政府机关, 公司企业, 商务住宅, 金融保险]
  soft_exempt_keywords: [博物馆, 纪念馆, 旧址, 遗址, 故居, 公园, 大学, 学院, 寺, 庙, 塔, 楼, 景区, 风景区, 文化, 艺术]
  brand_store_pattern: "\\(.*(店|分店|特许).*\\)"
  sub_facility_suffixes: [殿, 堂, 亭, 塔, 楼, 院, 阁, 池, 林, 台, 宫, 像, 雕像, 铜像]
  # 重庆特有：火锅/串串/烧烤是餐厅，观景台子设施太多
  local_exclude: [火锅, 串串, 烧烤, 观景台]

spatial:
  cluster_k: 12
  cluster_max_size: 5
  cluster_max_dist: 8.0
  min_pts_per_day: 6
  urban_districts: [渝中区, 江北区, 南岸区, 沙坪坝区, 九龙坡区, 大渡口区]

limits:
  max_pois: 400