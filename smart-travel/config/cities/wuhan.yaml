# config/cities/wuhan.yaml
#
# 武汉配置。
#
# 说明：
#   - 每个城市独立写全，不做继承
#   - 列表用流式（[...]）写法，省行数
#   - 锚点（transport_hubs / stay_districts）只写名字，
#     坐标从 data/processed/wuhan_anchors_clean.json 读
#
# 结构：
#   name/region      - 城市名和高德 API 的 region 参数
#   transport_hubs   - 交通枢纽（出发地选项）
#   stay_districts   - 住宿区（住宿选项）
#   crawl            - 抓取配置（每页条数、最大页数）
#   core_spots       - 核心景点，按兴趣分组。crawl 用它抓，clean 用它做豁免
#   category_words   - 类别词，用于补充抓取
#   clean_rules      - 清洗规则，所有黑名单/豁免/正则都放这里
#   spatial          - 空间排序参数（切簇、分片、补簇、城郊分离）
#   limits           - 单城市数据上限
# ============================================================

name: 武汉
region: 武汉

# ---------- 锚点：交通枢纽 ----------
# 用途：表单的"出发地"选项；空间排序时作为 Day1 起点
transport_hubs: [武汉站, 汉口站, 武昌站, 武汉东站, 天河机场]

# ---------- 锚点：住宿区 ----------
# 用途：表单的"住宿区域"选项；空间排序时作为 Day2+ 起点
stay_districts: [武昌区, 汉阳区, 青山区, 洪山区, 汉南区, 蔡甸区, 江夏区, 黄陂区, 新洲区, 江岸区, 江汉区, 硚口区, 东西湖区]

# ---------- 抓取配置 ----------
# 核心词：每个词抓 page_size_core 条，最多 max_pages_core 页
# 类别词：每个词抓 page_size_category 条，最多 max_pages_category 页
crawl:
  page_size_core: 5
  page_size_category: 20
  max_pages_core: 1
  max_pages_category: 2

# ---------- 核心景点 ----------
# 按兴趣分组。分组名会作为 _interest_group 打到 POI 上，
# clean 阶段用于豁免软过滤（核心词抓到的，一定是景点）
core_spots:
  历史人文: [黄鹤楼, 晴川阁, 归元禅寺, 古德寺, 湖北省博物馆, 辛亥革命博物院, 江汉关博物馆, 昙华林, 黎黄陂路]
  自然风光: [东湖, 磨山, 武汉大学, 龟山, 木兰天池, 沙湖公园, 解放公园, 中山公园]
  美食探店: [户部巷, 吉庆街, 粮道街, 万松园]
  购物休闲: [楚河汉街, 江汉路步行街, 光谷步行街, 武汉天地]
  夜生活: [汉口江滩, 武昌江滩, 长江夜游]

# ---------- 主景点归组 ----------
# build 阶段把同一主景点的多条记录合并成一条
# （name=canonical、aliases=变体名、tags/behaviors=并集）。
# 大部分由代码自动推断（全库最短包含名），这里只写自动规则覆盖不到的。
poi_groups:
  # 显式合并：canonical: [成员...]
  江汉路: [江汉路步行街, 江汉路嗨吃街, 江汉路·前进五路小吃美食一条街]
  江汉关: [江汉关博物馆, 江汉关大楼]
  光谷步行街: [光谷步行街D区, 光谷步行街下沉广场]
  Happy站台: [Happy站台C馆, Happy站台美食街]
  # 显式拆分：这些名字不参与自动子串归组，各自独立成组
  no_merge: [杨正古铁佛寺]

# ---------- 类别词 ----------
# 用于补充抓取，覆盖核心词遗漏的长尾景点
category_words: [美食街, 小吃街, 风景区, 寺庙, 步行街, 商业街]

# ---------- 清洗规则 ----------
# 规则优先级（代码里按此顺序执行）：
#   0. hard_exclude_*     硬过滤，命中即干掉，不可被任何豁免绕过
#   1. core_spots 完全匹配 豁免软过滤
#   2. 有 _interest_group  豁免软过滤
#   3. soft_exclude_*      软过滤，名字含豁免词则保留
#   4. brand_store_pattern 品牌店格式，干掉
#   5. sub_facility_suffixes 子设施格式，干掉
#   6. local_exclude       城市特有黑名单，干掉
clean_rules:
  # 硬过滤：名字命中即干掉（不可豁免）
  hard_exclude_names: [停车场, 售票处, 游客中心, 服务中心, 安检, 地铁站, 公交站, 出入口, 派出所, 公共厕所, 卫生间]

  # 硬过滤：类型命中即干掉（不可豁免）
  hard_exclude_types: [地铁站, 公交车站, 停车场, 售票处, 公共厕所, 住宿服务]

  # 软过滤：类型命中后，看名字有无豁免词
  soft_exclude_types: [学校, 科教文化服务, 政府机关, 公司企业, 商务住宅, 金融保险]

  # 软过滤豁免词：名字含这些词的，即使命中软过滤也保留
  soft_exempt_keywords: [博物馆, 纪念馆, 旧址, 遗址, 故居, 公园, 大学, 学院, 寺, 庙, 塔, 楼, 景区, 风景区, 文化, 艺术]

  # 品牌店格式：如"黄鹤楼(香港路特许店)"，正则匹配后干掉
  brand_store_pattern: "\\(.*(店|分店|特许).*\\)"

  # 子设施后缀：如"归元禅寺-大雄宝殿"，名字含 "-" 且后缀命中即干掉
  sub_facility_suffixes: [殿, 堂, 亭, 塔, 楼, 院, 阁, 池, 林, 台, 宫, 像, 雕像, 铜像]

  # 城市特有黑名单
  local_exclude: [光谷广场, 斗战胜佛]

# ---------- 空间排序参数 ----------
# 用于 spatial_sorter.py，把候选 POI 按地理位置分成 N 天
spatial:
  # 切小簇阶段：KMeans 初始簇数（上限，按候选数动态调）
  cluster_k: 12
  # 切小簇阶段：每簇最多几个点，超过递归拆
  cluster_max_size: 5
  # 切小簇阶段：每簇内两两最大距离（km），超过拆
  cluster_max_dist: 8.0
  # 聚片阶段：每片最少几个点，不够从别片挪
  min_pts_per_day: 6
  # 主城区列表：单点吸收、城郊分离用它判
  urban_districts: [江岸区, 江汉区, 硚口区, 武昌区, 洪山区, 青山区, 汉阳区]

# ---------- 数据上限 ----------
# clean 后单城市最多保留多少条，超出按 rating 降序截断
limits:
  max_pois: 400