# config/cities.yaml

# 全局默认配置，所有城市继承
defaults:
  crawl:
    page_size_core: 5        # 核心词每页抓 5 条
    page_size_category: 20   # 类别词每页抓 20 条
    max_pages_core: 1        # 核心词抓 1 页
    max_pages_category: 2    # 类别词抓 2 页
  limits:
    max_pois: 250            # 单城市清洗后上限
  exclude_types:             # 全局类型黑名单（所有城市共用）
    - 地铁站
    - 公交车站
    - 停车场
    - 售票处
    - 公共厕所
    - 住宿服务
  exclude_names:             # 全局名字黑名单
    - 停车场
    - 售票处
    - 游客中心
    - 出入口

# 城市列表
cities:
  wuhan:
    name: 武汉
    region: 武汉              # 高德 API 的 region 参数
    districts:
      - 武昌区
      - 江汉区
      - 江岸区
      - 汉阳区
      - 洪山区
      - 硚口区
      - 青山区
    core_spots:
      历史人文:
        - 黄鹤楼
        - 晴川阁
        - 归元禅寺
        - 古德寺
        - 湖北省博物馆
        - 辛亥革命博物院
        - 江汉关博物馆
        - 昙华林
        - 黎黄陂路
      自然风光:
        - 东湖
        - 磨山
        - 武汉大学
        - 龟山
        - 木兰天池
        - 沙湖公园
        - 解放公园
        - 中山公园
      美食探店:
        - 户部巷
        - 吉庆街
        - 粮道街
        - 万松园
      购物休闲:
        - 楚河汉街
        - 江汉路步行街
        - 光谷步行街
        - 武汉天地
      夜生活:
        - 汉口江滩
        - 武昌江滩
        - 长江夜游
    category_words:
      - 美食街
      - 小吃街
      - 风景区
      - 寺庙
      - 步行街
      - 商业街
