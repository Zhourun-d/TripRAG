# config/cities.yaml
#
# 城市配置：每个城市独立写全，不做继承。
#
# 为什么不做 defaults 继承：
#   - 只有 3 个城市，重复量不大
#   - 继承是隐式的，读配置时要心里做合并运算，容易出错
#   - 每个城市写全，打开文件一眼看到完整配置，可维护性更高
#
# 结构说明：
#   name/region      - 城市名和高德 API 的 region 参数
#   transport_hubs   - 交通枢纽（出发地选项），带经纬度
#   stay_districts   - 住宿区（住宿选项），带经纬度
#   crawl            - 抓取配置（每页条数、最大页数）
#   core_spots       - 核心景点，按兴趣分组。crawl 用它抓，clean 用它做豁免
#   category_words   - 类别词，用于补充抓取
#   clean_rules      - 清洗规则，所有黑名单/豁免/正则都放这里
#   spatial          - 空间排序参数（切簇、分片、补簇、远点判定）
#   limits           - 单城市数据上限
#
# 锚点坐标说明：
#   transport_hubs 和 stay_districts 的经纬度由 crawl 阶段抓取后回填。
#   当前为占位 0.0，跑完 crawl 后替换为真实值。
# ============================================================

cities:

  # ==========================================================
  # 武汉
  # ==========================================================
  wuhan:
    name: 武汉
    region: 武汉

    # ---------- 锚点：交通枢纽 ----------
    # 用途：表单的"出发地"选项；空间排序时作为 Day1 起点
    transport_hubs:
      - name: 武汉站
        lat: 0.0
        lng: 0.0
      - name: 汉口站
        lat: 0.0
        lng: 0.0
      - name: 武昌站
        lat: 0.0
        lng: 0.0
      - name: 武汉东站
        lat: 0.0
        lng: 0.0
      - name: 武汉天河国际机场
        lat: 0.0
        lng: 0.0

    # ---------- 锚点：住宿区 ----------
    # 用途：表单的"住宿区域"选项；空间排序时作为 Day2+ 起点
    # 坐标取行政区中心点，不需要精确到街道
    stay_districts:
      - name: 武昌区
        lat: 30.546
        lng: 114.316
      - name: 汉阳区
        lat: 30.554
        lng: 114.218
      - name: 青山区
        lat: 30.634
        lng: 114.386
      - name: 洪山区
        lat: 30.500
        lng: 114.343
      - name: 江岸区
        lat: 30.599
        lng: 114.309
      - name: 江汉区
        lat: 30.601
        lng: 114.271
      - name: 硚口区
        lat: 30.570
        lng: 114.211
      - name: 东西湖区
        lat: 30.620
        lng: 114.137
      - name: 蔡甸区
        lat: 30.582
        lng: 114.029
      - name: 江夏区
        lat: 30.376
        lng: 114.321
      - name: 黄陂区
        lat: 30.882
        lng: 114.375
      - name: 新洲区
        lat: 30.841
        lng: 114.801
      - name: 汉南区
        lat: 30.309
        lng: 114.084

    # ---------- 抓取配置 ----------
    # 核心词：每个词抓 page_size_core 条，最多 max_pages_core 页
    # 类别词：每个词抓 page_size_category 条，最多 max_pages_category 页
    crawl:
      page_size_core: 5
      page_size_category: 20
      max_pages_core: 1
      max_pages_category: 2

    # ---------- 核心景点 ----------
    # 按兴趣分组。分组名会作为 _interest_group 打到 POI 上，
    # clean 阶段用于豁免软过滤（核心词抓到的，一定是景点）
    core_spots:
      历史人文:
        - 黄鹤楼
        - 晴川阁
        - 归元禅寺
        - 古德寺
        - 湖北省博物馆
        - 辛亥革命博物院
        - 江汉关博物馆
        - 昙华林
        - 黎黄陂路
      自然风光:
        - 东湖
        - 磨山
        - 武汉大学
        - 龟山
        - 木兰天池
        - 沙湖公园
        - 解放公园
        - 中山公园
      美食探店:
        - 户部巷
        - 吉庆街
        - 粮道街
        - 万松园
      购物休闲:
        - 楚河汉街
        - 江汉路步行街
        - 光谷步行街
      夜生活:
        - 汉口江滩
        - 武昌江滩
        - 长江夜游

    # ---------- 类别词 ----------
    # 用于补充抓取，覆盖核心词遗漏的长尾景点
    category_words:
      - 美食街
      - 小吃街
      - 风景区
      - 寺庙
      - 步行街
      - 商业街

    # ---------- 清洗规则 ----------
    # 所有过滤规则集中在这里，改规则不用动代码。
    #
    # 规则优先级（代码里按此顺序执行）：
    #   0. hard_exclude_*     硬过滤，命中即干掉，不可被任何豁免绕过
    #   1. core_spots 完全匹配 豁免软过滤
    #   2. 有 _interest_group  豁免软过滤
    #   3. soft_exclude_*      软过滤，名字含豁免词则保留
    #   4. brand_store_pattern 品牌店格式，干掉
    #   5. sub_facility_suffixes 子设施格式，干掉
    #   6. local_exclude       城市特有黑名单，干掉
    clean_rules:

      # 硬过滤：名字命中即干掉（不可豁免）
      # 这些词不可能是景点名的一部分
      hard_exclude_names:
        - 停车场
        - 售票处
        - 游客中心
        - 服务中心
        - 安检
        - 地铁站
        - 公交站
        - 出入口
        - 派出所
        - 公共厕所
        - 卫生间

      # 硬过滤：类型命中即干掉（不可豁免）
      hard_exclude_types:
        - 地铁站
        - 公交车站
        - 停车场
        - 售票处
        - 公共厕所
        - 住宿服务

      # 软过滤：类型命中后，看名字有无豁免词
      # 有豁免词 → 保留（如"武汉大学"含"大学"）
      # 无豁免词 → 干掉（如"XX小学"）
      soft_exclude_types:
        - 学校
        - 科教文化服务
        - 政府机关
        - 公司企业
        - 商务住宅
        - 金融保险

      # 软过滤豁免词：名字含这些词的，即使命中软过滤也保留
      soft_exempt_keywords:
        - 博物馆
        - 纪念馆
        - 旧址
        - 遗址
        - 故居
        - 公园
        - 大学
        - 学院
        - 寺
        - 庙
        - 塔
        - 楼
        - 景区
        - 风景区
        - 文化
        - 艺术

      # 品牌店格式：如"黄鹤楼(香港路特许店)"，正则匹配后干掉
      brand_store_pattern: "\\(.*(店|分店|特许).*\\)"

      # 子设施后缀：如"归元禅寺-大雄宝殿"，名字含 "-" 且后缀命中即干掉
      sub_facility_suffixes:
        - 殿
        - 堂
        - 亭
        - 塔
        - 楼
        - 院
        - 阁
        - 池
        - 林
        - 台
        - 宫
        - 像
        - 雕像
        - 铜像

      # 城市特有黑名单：名字或类型命中即干掉
      local_exclude:
        - 光谷广场
        - 斗战胜佛

    # ---------- 空间排序参数 ----------
    # 用于 spatial_sorter.py，把候选 POI 按地理位置分成 N 天。
    # 参数含义见下方注释，调参只改这里，不用动代码。
    # ---------- 空间排序参数 ----------
    # 用于 spatial_sorter.py，把候选 POI 按地理位置分成 N 天。
    # 参数含义见下方注释，调参只改这里，不用动代码。
    spatial:
      # 切小簇阶段：KMeans 初始簇数。
      # 候选多时簇多、候选少时簇少，代码里会按候选数动态调，
      # 这个值是上限（不会超过这个簇数）。
      cluster_k: 12

      # 切小簇阶段：每簇最多几个点。
      # 超过就递归拆，避免某簇太大、聚片时占掉一整片。
      cluster_max_size: 5

      # 切小簇阶段：每簇内两两最大距离（km）。
      # 超过就把最远的点拆出去，避免"一根长条"跨半座城。
      cluster_max_dist: 8.0

      # 聚片阶段：每片最少几个点。
      # 不够就从"搬得起且离得近"的片挪簇过来。
      min_pts_per_day: 6

      # 主城区列表。用途：
      #   1. 单点吸收只对主城区的单点簇生效，郊区单点不吸
      #   2. 城郊分离：主城区的簇参与聚片，郊区的簇搁置
      # 为什么用区名表而不是"离住宿区距离"：
      #   - 距离阈值要调，设宽了把远郊算成近郊
      #   - 主城区是地理事实，写死更准，换城市补一份即可
      urban_districts:
        - 江岸区
        - 江汉区
        - 硚口区
        - 武昌区
        - 洪山区
        - 青山区
        - 汉阳区

    # ---------- 数据上限 ----------
    # clean 后单城市最多保留多少条
    # 超出时按 rating 降序截断（高分优先保留）
    limits:
      max_pois: 400

